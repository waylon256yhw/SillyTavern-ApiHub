<div id="apihub_container" class="apihub">
    <!-- Branding -->
    <div class="apihub_branding">
        <span class="apihub_brand_name"><i class="fa-solid fa-hub"></i> API Hub</span>
        <span class="apihub_brand_ver">v0.1.0</span>
        <span class="flex1"></span>
        <div id="apihub_btn_toggle_native" class="apihub_toggle_btn" title="切换原生 / ApiHub 界面">
            <i class="fa-solid fa-arrows-rotate"></i> Native UI
        </div>
    </div>

    <!-- Connection selector bar -->
    <div class="apihub_section">
        <div class="apihub_connection_bar">
            <select id="apihub_connection_select" class="text_pole"></select>
            <div id="apihub_btn_rename" class="menu_button menu_button_icon" title="Rename">
                <i class="fa-solid fa-pencil"></i>
            </div>
            <div id="apihub_btn_duplicate" class="menu_button menu_button_icon" title="Duplicate">
                <i class="fa-solid fa-copy"></i>
            </div>
            <div id="apihub_btn_save" class="menu_button menu_button_icon" title="Save changes">
                <i class="fa-solid fa-floppy-disk"></i>
            </div>
            <div id="apihub_btn_add" class="menu_button menu_button_icon" title="New Connection">
                <i class="fa-solid fa-plus"></i>
            </div>
            <div id="apihub_btn_delete" class="menu_button menu_button_icon" title="Delete">
                <i class="fa-solid fa-trash-can"></i>
            </div>
        </div>
    </div>

    <!-- Inline rename -->
    <div id="apihub_rename_row" class="apihub_section" style="display:none;">
        <div class="apihub_inline_row">
            <input id="apihub_rename_input" type="text" class="text_pole" placeholder="Connection name" />
            <div id="apihub_rename_ok" class="menu_button menu_button_icon"><i class="fa-solid fa-check"></i></div>
            <div id="apihub_rename_cancel" class="menu_button menu_button_icon"><i class="fa-solid fa-xmark"></i></div>
        </div>
    </div>

    <!-- Inline new connection -->
    <div id="apihub_new_row" class="apihub_section" style="display:none;">
        <div class="apihub_inline_row">
            <input id="apihub_new_input" type="text" class="text_pole" placeholder="New connection name (e.g. OpenRouter, 硅基流动)" />
            <div id="apihub_new_ok" class="menu_button menu_button_icon"><i class="fa-solid fa-check"></i></div>
            <div id="apihub_new_cancel" class="menu_button menu_button_icon"><i class="fa-solid fa-xmark"></i></div>
        </div>
    </div>

    <!-- Active badge -->
    <div id="apihub_active_badge" class="apihub_section" style="display:none;">
        <span class="apihub_badge apihub_badge_active"><i class="fa-solid fa-bolt"></i> Active Connection</span>
    </div>

    <!-- Protocol format -->
    <div class="apihub_section">
        <label class="apihub_label">API Format</label>
        <select id="apihub_format_select" class="text_pole">
            <option value="openai">OpenAI Compatible</option>
            <option value="anthropic">Anthropic</option>
            <option value="gemini">Google Gemini</option>
        </select>
    </div>

    <!-- Endpoint URL -->
    <div class="apihub_section">
        <label class="apihub_label">Endpoint URL</label>
        <input id="apihub_endpoint" type="text" class="text_pole apihub_mono" placeholder="https://api.openai.com" />
        <small class="apihub_hint">末尾加 <code>#</code> 跳过 URL 自动归一化（直连模式）</small>
    </div>

    <!-- URL Preview -->
    <div id="apihub_url_preview" class="apihub_section apihub_preview" style="display:none;">
        <span class="apihub_preview_url" id="apihub_preview_chat_url"></span>
        <span id="apihub_preview_literal" class="apihub_badge_warn" style="display:none;">直连模式：URL 将原样使用，不自动拼接版本号和路径</span>
    </div>

    <!-- API Key -->
    <div class="apihub_section">
        <label class="apihub_label">API Key</label>
        <div class="apihub_inline_row">
            <input id="apihub_apikey" type="password" class="text_pole apihub_mono flex1" placeholder="sk-..." autocomplete="off" />
            <div id="apihub_btn_show_key" class="menu_button menu_button_icon" title="Toggle visibility">
                <i class="fa-solid fa-eye"></i>
            </div>
            <div id="apihub_btn_manage_keys" class="menu_button menu_button_icon" title="管理密钥库">
                <i class="fa-solid fa-key"></i>
            </div>
        </div>
    </div>

    <!-- Models -->
    <div class="apihub_section">
        <div class="apihub_label_row">
            <label class="apihub_label">Model</label>
            <div class="apihub_label_actions">
                <span id="apihub_btn_add_model" class="apihub_link">+ Add</span>
                <span id="apihub_btn_delete_model" class="apihub_link" style="display:none;"><i class="fa-solid fa-xmark"></i> Delete</span>
                <span id="apihub_btn_fetch_models" class="apihub_link"><i class="fa-solid fa-rotate"></i> Fetch</span>
            </div>
        </div>
        <select id="apihub_model_select" class="text_pole"></select>
    </div>

    <!-- Inline add model -->
    <div id="apihub_add_model_row" class="apihub_section" style="display:none;">
        <div class="apihub_inline_row">
            <input id="apihub_add_model_input" type="text" class="text_pole" placeholder="Model ID (e.g. gpt-4o)" />
            <div id="apihub_add_model_ok" class="menu_button menu_button_icon"><i class="fa-solid fa-check"></i></div>
            <div id="apihub_add_model_cancel" class="menu_button menu_button_icon"><i class="fa-solid fa-xmark"></i></div>
        </div>
    </div>

    <!-- Action buttons -->
    <div class="apihub_section">
        <div class="apihub_actions">
            <div id="apihub_btn_migrate" class="menu_button menu_button_icon">
                <i class="fa-solid fa-download"></i> <span>迁移</span>
            </div>
            <div id="apihub_btn_export" class="menu_button menu_button_icon">
                <i class="fa-solid fa-file-export"></i> <span>导出</span>
            </div>
            <div id="apihub_btn_import" class="menu_button menu_button_icon">
                <i class="fa-solid fa-file-import"></i> <span>导入</span>
            </div>
        </div>
    </div>

    <!-- Reset (dangerous) -->
    <div class="apihub_section">
        <div id="apihub_btn_reset" class="apihub_reset_btn" title="清除所有 API Hub 数据，恢复初始状态">
            <i class="fa-solid fa-triangle-exclamation"></i> 重置所有连接配置
        </div>
    </div>

    <!-- Connection status -->
    <div id="apihub_status_section" class="apihub_section" style="display:none;">
        <div class="apihub_status_row">
            <span id="apihub_status_dot" class="apihub_dot"></span>
            <span id="apihub_status_text" class="apihub_status_text"></span>
        </div>
    </div>

    <!-- Custom Parameters -->
    <div class="apihub_section">
        <div class="apihub_label_row apihub_collapsible" id="apihub_params_toggle">
            <label class="apihub_label"><i class="fa-solid fa-chevron-right apihub_collapse_icon"></i> 自定义请求参数</label>
        </div>
    </div>

    <div id="apihub_params_panel" style="display:none;">
        <!-- Exclude body parameters -->
        <div class="apihub_section apihub_card">
            <label class="apihub_label apihub_sublabel">排除参数</label>
            <small class="apihub_hint">勾选的参数将从请求体中移除，适用于 API 不支持某些默认参数的场景</small>
            <div id="apihub_exclude_body" class="apihub_checkbox_list">
                <label class="apihub_checkbox_item"><input type="checkbox" value="temperature" /><span>temperature</span></label>
                <label class="apihub_checkbox_item"><input type="checkbox" value="top_p" /><span>top_p</span></label>
                <label class="apihub_checkbox_item"><input type="checkbox" value="top_k" /><span>top_k</span></label>
                <label class="apihub_checkbox_item"><input type="checkbox" value="frequency_penalty" /><span>frequency_penalty</span></label>
                <label class="apihub_checkbox_item"><input type="checkbox" value="presence_penalty" /><span>presence_penalty</span></label>
            </div>
        </div>

        <!-- Include body parameters -->
        <div class="apihub_section apihub_card">
            <div class="apihub_label_row">
                <label class="apihub_label apihub_sublabel">自定义参数</label>
                <span id="apihub_btn_add_param" class="apihub_link">+ 添加</span>
            </div>
            <small class="apihub_hint">键值对会合并到请求体中，可用于添加 API 特有的参数</small>
            <div id="apihub_include_body" class="apihub_kv_list"></div>
        </div>

        <!-- Include headers -->
        <div class="apihub_section apihub_card">
            <div class="apihub_label_row">
                <label class="apihub_label apihub_sublabel">自定义请求头</label>
                <span id="apihub_btn_add_header" class="apihub_link">+ 添加</span>
            </div>
            <small class="apihub_hint">键值对会合并到请求头中，适用于需要额外认证或路由标识的场景</small>
            <div id="apihub_include_headers" class="apihub_kv_list"></div>
        </div>
    </div>
</div>
